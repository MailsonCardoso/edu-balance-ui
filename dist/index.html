<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site fora do ar</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 48px 40px;
      }
      .icon {
        font-size: 56px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 17px;
        line-height: 1.6;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#128679;</div>
      <h1>Site temporariamente fora do ar</h1>
      <p>
        Estamos realizando manutenção em nosso sistema. <br />
        Em breve estaremos de volta!
      </p>
    </div>
  </body>
</html>
